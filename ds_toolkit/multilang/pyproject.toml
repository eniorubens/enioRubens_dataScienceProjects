[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilang"
version = "1.0.0"
description = "Dictionary-based text translator with persistent cache for multi-language notebooks"
requires-python = ">=3.10"
dependencies = [
    "deep-translator>=1.11.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["multilang*"]
