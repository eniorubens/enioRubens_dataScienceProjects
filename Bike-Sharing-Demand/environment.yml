# Conda environment for Bike-Sharing-Demand_v4.
#
# Versions are pinned to the environment used to produce the published
# results. The saved model artifacts were serialized with scikit-learn 1.3.2,
# xgboost 2.0.3 and lightgbm 4.1.0.
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
name: Bike-Sharing
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # Build backend — pinned because setuptools>=71 removed pkg_resources,
      # which mlflow 2.10.0 still imports at load time.
      - setuptools==69.5.1
      - wheel==0.45.1
      # Core data science
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy==1.15.3
      - statsmodels==0.14.6
      # Machine learning
      - scikit-learn==1.3.2
      - xgboost==2.0.3
      - lightgbm==4.1.0
      - catboost==1.2.2
      - category-encoders==2.6.3
      - feature-engine==1.6.2
      - optuna==3.5.0
      # Visualization
      - matplotlib==3.10.9
      - seaborn==0.13.2
      # MLflow tracking
      - mlflow==2.10.0
      # Feature engineering
      - phik==0.12.5
      # Testing
      - pytest==7.4.4
      - pytest-cov==4.1.0
      # Code quality
      - black==23.11.0
      - flake8==6.1.0
      # Notebook support
      - ipython==8.37.0
      - ipykernel==7.2.0
      - nbformat==5.10.4
      - nbconvert==7.17.1
      - nbclient==0.11.0
      # Published i18n toolkit used by src/i18n.py. In the portfolio repository
      # it is kept in the sibling path ds_toolkit/multilang.
      - -e ../ds_toolkit/multilang
