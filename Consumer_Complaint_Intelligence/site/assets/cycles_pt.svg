<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
  <title id="title">Status dos ciclos confirmatórios</title><desc id="desc">S8 passou dois de três gates; V2.1-C passou três de quatro. Nenhum ciclo foi confirmado.</desc>
