<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="title desc">
  <title id="title">Status dos ciclos S8, V2.1-C e V3</title><desc id="desc">S8 passou dois de três gates; V2.1-C passou três de quatro. Nenhum dos dois foi confirmado. O V3 é um ciclo de desenvolvimento cujo protocolo de confirmação foi aprovado e ainda não foi executado.</desc>
  <rect width="860" height="460" fill="#f8fafc"/><text x="48" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b4d">Nenhum ciclo confirmou deployment</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="15" fill="#53657d">O veredito é definido pelo gate, não pelo número de gates aprovados</text>
  <g font-family="Arial,sans-serif" fill="#172b4d"><text x="55" y="145" font-size="18" font-weight="700">S8 · V1</text><text x="55" y="225" font-size="18" font-weight="700">V2.1-C · V2</text><text x="55" y="305" font-size="18" font-weight="700">V3-C · V3</text><text x="55" y="385" font-size="15" fill="#53657d">Decisão</text></g>
  <rect x="180" y="120" width="510" height="34" rx="17" fill="#e5ebf3"/><rect x="180" y="120" width="340" height="34" rx="17" fill="#2f6fed"/><rect x="180" y="200" width="510" height="34" rx="17" fill="#e5ebf3"/><rect x="180" y="200" width="383" height="34" rx="17" fill="#2f6fed"/><rect x="180" y="280" width="510" height="34" rx="17" fill="#e5ebf3"/>
  <g font-family="Arial,sans-serif" fill="#172b4d"><text x="720" y="145" font-size="18" font-weight="700">2 / 3</text><text x="720" y="225" font-size="18" font-weight="700">3 / 4</text><text x="720" y="305" font-size="18" font-weight="700">não executado</text><text x="180" y="385" font-size="18" font-weight="700" fill="#b7433e">NOT_CONFIRMED · deploy=false</text><text x="180" y="412" font-size="14" fill="#53657d">V2.1-C falhou na barra absoluta de F1 crítico: 0,2604 &lt; 0,2715.</text><text x="180" y="434" font-size="14" fill="#53657d">V3: confirmação aprovada, aguardando a fonte completa de 2026.</text></g>
</svg>
