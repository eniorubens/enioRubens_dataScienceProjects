<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
  <title id="title">Confirmatory cycle status</title><desc id="desc">S8 passed two of three gates; V2.1-C passed three of four. Neither cycle was confirmed.</desc>
  <rect width="860" height="360" fill="#f8fafc"/><text x="48" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b4d">No cycle confirmed deployment</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="15" fill="#53657d">The verdict is defined by the gates, not by the number of passing gates</text>
  <g font-family="Arial,sans-serif" fill="#172b4d"><text x="55" y="145" font-size="18" font-weight="700">S8 · V1</text><text x="55" y="225" font-size="18" font-weight="700">V2.1-C · V2</text><text x="55" y="305" font-size="15" fill="#53657d">Decision</text></g>
  <rect x="180" y="120" width="510" height="34" rx="17" fill="#e5ebf3"/><rect x="180" y="120" width="340" height="34" rx="17" fill="#2f6fed"/><rect x="180" y="200" width="510" height="34" rx="17" fill="#e5ebf3"/><rect x="180" y="200" width="383" height="34" rx="17" fill="#2f6fed"/>
  <g font-family="Arial,sans-serif" fill="#172b4d"><text x="720" y="145" font-size="18" font-weight="700">2 / 3</text><text x="720" y="225" font-size="18" font-weight="700">3 / 4</text><text x="180" y="305" font-size="18" font-weight="700" fill="#b7433e">NOT_CONFIRMED · deploy=false</text><text x="180" y="332" font-size="14" fill="#53657d">V2.1-C failed the absolute critical-F1 bar: 0.2604 &lt; 0.2715.</text></g>
</svg>
