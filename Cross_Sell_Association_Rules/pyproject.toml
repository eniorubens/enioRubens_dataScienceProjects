[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-sell-rules"
version = "1.0.0"
description = "Market basket analysis helpers for cross-sell association rules"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Enio Rubens" }]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "mlxtend>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
