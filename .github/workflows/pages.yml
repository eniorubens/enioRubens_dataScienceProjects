name: Publicar portfólio FD001

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package only public static pages
        run: |
          mkdir -p _site/CMAPSS_Predictive_Maintenance
          cp -a CMAPSS_Predictive_Maintenance/site/. _site/CMAPSS_Predictive_Maintenance/
          cp pages-publicacao/index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
