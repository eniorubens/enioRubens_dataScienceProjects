name: Publicar portfólio

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package public static pages
        run: |
          mkdir -p _site/CMAPSS_Predictive_Maintenance
          cp -a CMAPSS_Predictive_Maintenance/site/. _site/CMAPSS_Predictive_Maintenance/
          mkdir -p _site/ModelRisk_ResponsibleML
          cp -a ModelRisk_ResponsibleML/site/. _site/ModelRisk_ResponsibleML/
          cp -a ModelRisk_ResponsibleML/pt-BR _site/ModelRisk_ResponsibleML/
          cp -a ModelRisk_ResponsibleML/en-US _site/ModelRisk_ResponsibleML/
          cp -a ModelRisk_ResponsibleML/docs _site/ModelRisk_ResponsibleML/
          mkdir -p _site/ModelRisk_ResponsibleML/data
          cp -a ModelRisk_ResponsibleML/data/processed _site/ModelRisk_ResponsibleML/data/
          sed -i \
            -e 's#\.\./pt-BR/#pt-BR/#g' \
            -e 's#\.\./en-US/#en-US/#g' \
            -e 's#\.\./docs/#docs/#g' \
            -e 's#\.\./data/#data/#g' \
            _site/ModelRisk_ResponsibleML/index.html \
            _site/ModelRisk_ResponsibleML/en.html
          mkdir -p "_site/Customer Lifetime Value"
          cp -a "Customer Lifetime Value/site/." "_site/Customer Lifetime Value/"
          mkdir -p _site/Customer_Segmentation_and_Next_Best_Action
          cp -a Customer_Segmentation_and_Next_Best_Action/site/. _site/Customer_Segmentation_and_Next_Best_Action/
          cp pages-publicacao/index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
