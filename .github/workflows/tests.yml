name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides which suites this run needs. Suite definitions and path rules live in
  # .github/ci/test-projects.json; the selection logic is .github/ci/select_tests.py.
  # Manual dispatch, changes to CI/global config, uncertain ds_toolkit impact and
  # any diff that cannot be computed safely all fall back to the full battery.
  detect:
    name: Select test suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      settings: ${{ steps.select.outputs.settings }}
      has_matrix: ${{ steps.select.outputs.has_matrix }}
      bike: ${{ steps.select.outputs.bike }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute changed paths
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after || github.sha }}
        run: |
          set -u
          full() { echo "full_reason=$1" >> "$GITHUB_OUTPUT"; echo "Full battery: $1"; exit 0; }
          have() { git cat-file -e "$1^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$1" 2>/dev/null; git cat-file -e "$1^{commit}" 2>/dev/null; }
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request)
              [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ] || full "pull request SHAs missing"
              have "$PR_BASE" && have "$PR_HEAD" || full "pull request commits not available"
              base=$(git merge-base "$PR_BASE" "$PR_HEAD") || full "no merge base between base and head"
              head="$PR_HEAD" ;;
            push)
              [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] || full "push without a previous commit"
              have "$PUSH_BEFORE" && have "$PUSH_AFTER" || full "pushed commits not available (force push?)"
              base="$PUSH_BEFORE"; head="$PUSH_AFTER" ;;
            workflow_dispatch)
              full "manual dispatch" ;;
            *)
              full "unsupported event $EVENT" ;;
          esac
          git diff --name-status -z -M "$base" "$head" > "$RUNNER_TEMP/changed.z" || full "git diff failed"
          echo "Comparing $base..$head"
          git diff --name-status -M "$base" "$head" || true
          echo "diff_file=$RUNNER_TEMP/changed.z" >> "$GITHUB_OUTPUT"
      - name: Self-test selector
        run: python3 -m unittest discover -s .github/ci -p "test_*.py"
      - name: Select suites
        id: select
        env:
          FULL_REASON: ${{ steps.diff.outputs.full_reason }}
          DIFF_FILE: ${{ steps.diff.outputs.diff_file }}
        run: |
          if [ -n "$FULL_REASON" ]; then
            python3 .github/ci/select_tests.py --full "$FULL_REASON"
          else
            python3 .github/ci/select_tests.py --diff-file "$DIFF_FILE"
          fi
          cat "$GITHUB_OUTPUT"

  tests:
    # No expression in the name: GitHub appends the matrix value itself, giving
    # "tests (<project>)", and a skipped matrix shows a plain "tests".
    name: tests
    needs: detect
    if: needs.detect.outputs.has_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ fromJSON(needs.detect.outputs.settings)[matrix.project].python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          ${{ fromJSON(needs.detect.outputs.settings)[matrix.project].install }}
      - name: Prepare data
        if: ${{ fromJSON(needs.detect.outputs.settings)[matrix.project].prepare != '' }}
        run: ${{ fromJSON(needs.detect.outputs.settings)[matrix.project].prepare }}
      - name: Run tests
        run: python -m pytest -q

  # Bike-Sharing-Demand refuses to run outside a conda environment named
  # "Bike-Sharing" (src/environment.py), so it gets its own conda job. The env is
  # created from inside the project folder because environment.yml installs
  # ../ds_toolkit/multilang by relative path.
  bike-sharing:
    needs: detect
    if: needs.detect.outputs.bike == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Bike-Sharing-Demand
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: false
      - name: Create environment
        shell: bash -el {0}
        run: conda env create -f environment.yml
      - name: Install test dependency missing from environment.yml
        # shap is imported by tests/test_final_validation.py but is not declared in
        # environment.yml. That file is part of the provenance fingerprint
        # (src/environment.py), so it is left untouched here.
        shell: bash -el {0}
        run: conda run -n Bike-Sharing pip install "numpy==1.26.4" "shap==0.49.1" "numba==0.66.0" "llvmlite==0.48.0"
      - name: Run tests
        shell: bash -el {0}
        run: conda run --no-capture-output -n Bike-Sharing python -m pytest -q

  # Single stable check for branch rules: always reports, passes when every
  # selected suite passed or was skipped by selection, fails on any real failure.
  result:
    name: Tests result
    needs: [detect, tests, bike-sharing]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        env:
          DETECT: ${{ needs.detect.result }}
          TESTS: ${{ needs.tests.result }}
          BIKE: ${{ needs.bike-sharing.result }}
          MODE: ${{ needs.detect.outputs.mode }}
        run: |
          echo "mode=$MODE detect=$DETECT tests=$TESTS bike-sharing=$BIKE"
          [ "$DETECT" = success ] || { echo "::error::suite selection did not succeed"; exit 1; }
          for r in "$TESTS" "$BIKE"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a selected suite ended with '$r'"; exit 1 ;;
            esac
          done
