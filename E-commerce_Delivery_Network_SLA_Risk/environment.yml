name: ecom-delivery-sla
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pandas>=2.2,<3
  - numpy>=1.26,<2.4
  - scipy>=1.12,<1.17
  - scikit-learn>=1.6,<2
  - statsmodels>=0.14,<1
  - networkx>=3.2,<4
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<1
  - plotly>=6,<8
  - folium>=0.16,<1
  - jupyterlab>=4,<5
  - notebook>=7,<8
  - ipykernel>=6.29,<7
  - ipywidgets>=8.1,<9
  - nbformat>=5.10,<6
  - nbclient>=0.10,<1
  - nbconvert>=7,<8
  - optuna>=3.6,<5
  - catboost>=1.2,<2
  - xgboost>=2.1,<4
  - lightgbm>=4.3,<5
  - pytest>=8,<9
  - pytest-cov>=5,<7
  - ruff>=0.6,<1
  - pyyaml>=6,<7
  - pip:
      - -e .[dev]
variables:
  # Ignore packages in the user folder (AppData\Roaming\Python on Windows), which
  # otherwise shadow the env's own versions (e.g. an old platformdirs breaks pytest).
  PYTHONNOUSERSITE: "1"
