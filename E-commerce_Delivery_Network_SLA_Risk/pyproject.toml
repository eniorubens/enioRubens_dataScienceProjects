[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-delivery-sla"
version = "0.1.0"
description = "Reusable analysis code for e-commerce delivery delay and SLA risk"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2.4",
    "pandas>=2.2,<3",
    "plotly>=6,<8",
    "folium>=0.16,<1",
    "scipy>=1.12,<1.17",
    "scikit-learn>=1.6,<2",
    "statsmodels>=0.14,<1",
    "networkx>=3.2,<4",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "catboost>=1.2,<2",
    "xgboost>=2.1,<4",
    "lightgbm>=4.3,<5",
    "optuna>=3.6,<5",
]

[project.optional-dependencies]
# Running, validating and exporting the notebooks (VS Code/Jupyter kernel, nbclient, nbconvert).
notebooks = [
    "jupyterlab>=4,<5",
    "notebook>=7,<8",
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.1,<9",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
]
# Tests, lint and everything above (the export tests use nbconvert for real).
dev = [
    "ecom-delivery-sla[notebooks]",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D"]
per-file-ignores = {"tests/*" = ["D"]}

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
