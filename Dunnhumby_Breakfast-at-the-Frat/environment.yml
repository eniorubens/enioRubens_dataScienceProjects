name: retail-multilevel
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # Data and stats (Python side)
  - pandas>=2.2,<3
  - numpy>=1.26,<2.4
  - scipy>=1.12,<1.17
  - statsmodels>=0.14,<1
  - scikit-learn>=1.6,<2
  - pyarrow>=16
  - openpyxl>=3.1,<4
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<1
  - plotly>=6,<8
  # Multilevel engine (R side, isolated inside this env; the system R is not used)
  - r-base=4.4
  - r-lme4
  - r-lmertest
  - r-glmmtmb
  - r-arrow
  - rpy2>=3.5
  - m2-make  # Windows: rpy2 runs `R CMD config`, whose config.sh needs make
  # ML challenger
  - lightgbm>=4.3,<5
  - optuna>=3.6,<6
  # Notebooks
  - jupyterlab>=4,<5
  - ipykernel>=6.29,<7
  - ipywidgets>=8.1,<9
  - nbformat>=5.10,<6
  - nbclient>=0.10,<1
  - nbconvert>=7,<8
  # Dev
  - pytest>=8,<9
  - pytest-cov>=5,<7
  - ruff>=0.6,<1
  - pyyaml>=6,<7
  - pip:
      - gpboost>=1.5
      - -e .[dev]
variables:
  # Ignore packages in the user folder (AppData\Roaming\Python on Windows), which
  # otherwise shadow the env's own versions.
  PYTHONNOUSERSITE: "1"
