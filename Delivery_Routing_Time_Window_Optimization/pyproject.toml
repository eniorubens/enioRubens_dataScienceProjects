[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-routing-vrptw"
version = "0.1.0"
description = "Reusable code for capacitated vehicle routing with time windows on the Solomon benchmark"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "ortools==9.15.6755",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4,<5",
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
]
dev = [
    "delivery-routing-vrptw[notebooks]",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["scripts/audit_cvrplib_bks.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D"]
per-file-ignores = {"tests/*" = ["D"], "scripts/*" = ["D103"], "*.ipynb" = ["E402"]}

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"

[tool.setuptools.packages.find]
where = ["src"]
