name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# CI valida código, testes com fixtures sintéticas e a estrutura dos notebooks.
# Execuções do solver sobre o benchmark completo são validações locais separadas.
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint source, tests and scripts
        run: python -m ruff check src tests scripts

      - name: Run unit and contract tests
        run: python -m pytest -q --cov=delivery_routing_vrptw --cov-report=term-missing
